<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Browser</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 { margin-bottom: 20px; }
        .search-box {
            display: flex;
            width: 80%;
            max-width: 600px;
            background: #1e1e1e;
            border: 2px solid #333;
            border-radius: 30px;
            padding: 10px 20px;
        }
        input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            outline: none;
        }
        button {
            background: #7289da;
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #5b73c7; }
    </style>
</head>
<body>

    <h1>Search Web Freely</h1>
    <div class="search-box">
        <input type="text" id="url-input" placeholder="Type a URL or search Google...">
        <button onclick="launchProxy()">Go</button>
    </div>

    <script>
        function launchProxy() {
            let input = document.getElementById('url-input').value.trim();
            if (!input) return;

            // Format input into a proper URL
            if (!input.includes('.') || input.includes(' ')) {
                input = 'https://google.com' + encodeURIComponent(input);
            } else if (!/^https?:\/\//i.test(input)) {
                input = 'https://' + input;
            }

            // Route through an unblocked mirror frame handler
            const proxyUrl = 'https://tomp.app' + encodeURIComponent(input);
            window.location.href = proxyUrl;
        }

        // Allow pressing Enter key to search
        document.getElementById('url-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') { launchProxy(); }
        });
    </script>

</body>
</html>
